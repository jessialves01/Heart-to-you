<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coração Interativo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Gerar partículas do coração
        const particles = [];
        for (let i = 0; i < 1200; i++) {
            const t = Math.random() * Math.PI * 2;
            // Equação paramétrica do coração
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            
            particles.push({
                x: x,
                y: y,
                size: Math.random() * 2 + 1,
                color: `hsl(${Math.random() * 40 + 320}, 100%, 70%)` // Tons de rosa e magenta vibrantes
            });
        }

        function draw() {
            // Fundo semi-transparente para criar efeito de rasto suave
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            // Ajustar escala com base no tamanho da tela do telemóvel
            const scale = Math.min(canvas.width, canvas.height) / 35;

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x * scale, p.y * scale, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
