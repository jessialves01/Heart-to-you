<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coração Interativo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function heart(a, scale) {
            const x = 16 * Math.pow(Math.sin(a), 3) * scale;
            const y = (13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)) * scale;
            return { x, y };
        }

        function random(min, max) {
            return min + Math.random() * (max - min);
        }

        const particles = [];
        
        // Gerar partículas
        for (let i = 0; i < 3000; i++) {
            const a = random(0, 2 * Math.PI);
            const sc = random(0.5, 12.0);
            const h = heart(a, sc);
            const ang = Math.atan2(h.y, h.x) + random(-0.3, 0.3);
            const length = random(4, 14);
            
            particles.push({
                x1: h.x,
                y1: h.y,
                x2: h.x + length * Math.cos(ang),
                y2: h.y + length * Math.sin(ang),
                color: `rgb(255, ${Math.floor(random(65, 128))}, ${Math.floor(random(153, 217)})})`,
                width: random(0.5, 1.2)
            });
        }

        for (let i = 0; i < 1200; i++) {
            const a = random(0, 2 * Math.PI);
            const h = heart(a, 8.0);
            const ang = Math.atan2(h.y, h.x) + random(-0.35, 0.35);
            const length = random(10, 28);
            
            particles.push({
                x1: h.x + random(-2, 2),
                y1: h.y + random(-2, 2),
                x2: h.x + length * Math.cos(ang),
                y2: h.y + length * Math.sin(ang),
                color: `rgb(0, ${Math.floor(random(115, 191))}, ${Math.floor(random(191, 242)})})`,
                width: random(0.4, 0.9)
            });
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(1, -1);

            particles.forEach(p => {
                ctx.beginPath();
                ctx.strokeStyle = p.color;
                ctx.lineWidth = p.width;
                ctx.moveTo(p.x1, p.y1);
                ctx.lineTo(p.x2, p.y2);
                ctx.stroke();
            });

            ctx.restore();
            requestAnimationFrame(draw);
        }

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        draw();
    </script>
</body>
</html>
